<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小绿吃豆人 - 博客小游戏</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    <style>
        /* 游戏专用样式 - 匹配博客绿色主题 */
        .game-container {
            max-width: 650px;
            margin: 2rem auto;
            padding: 0 1rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .game-header {
            margin-bottom: 1.5rem;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px var(--shadow);
            border: 2px solid var(--green-light);
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--green-dark);
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        #gameCanvas {
            border: 4px solid var(--green-main);
            border-radius: 12px;
            background: var(--cream);
            box-shadow: 0 4px 20px var(--shadow);
            max-width: 100%;
            height: auto;
        }
        .game-controls {
            margin-top: 1.5rem;
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            border: 2px solid var(--green-light);
        }
        .game-controls h3 {
            color: var(--green-dark);
            margin-bottom: 1rem;
        }
        .control-hint {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            color: var(--green-deep);
        }
        .game-btn {
            background: linear-gradient(135deg, var(--green-light), var(--green-main));
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 2px 10px var(--shadow);
            margin: 0.3rem 0.5rem;
            text-decoration: none;
            display: inline-block;
        }
        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--shadow);
            background: linear-gradient(135deg, var(--green-main), var(--green-deep));
        }
        .back-btn {
            background: white;
            color: var(--green-main);
            border: 2px solid var(--green-main);
        }
        .back-btn:hover {
            background: var(--cream);
            color: var(--green-deep);
        }
        .game-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem 3rem;
            border-radius: 20px;
            border: 3px solid var(--green-main);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 1000;
            text-align: center;
            display: none;
            min-width: 300px;
        }
        .game-message h2 {
            color: var(--green-dark);
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }
        .game-message p {
            color: var(--green-deep);
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        .key {
            display: inline-block;
            background: var(--cream);
            border: 1px solid var(--green-light);
            border-radius: 6px;
            padding: 0.2rem 0.6rem;
            font-family: monospace;
            font-weight: bold;
            color: var(--green-dark);
            margin: 0 0.2rem;
        }
        .mobile-controls {
            display: none;
            margin: 1rem auto;
            max-width: 200px;
        }
        .mobile-btn {
            width: 60px;
            height: 60px;
            border: none;
            background: var(--green-main);
            color: white;
            border-radius: 50%;
            font-size: 1.5rem;
            margin: 0.2rem;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow);
        }
        @media (max-width: 600px) {
            .mobile-controls {
                display: block;
            }
        }
    </style>
</head>
<body>
    <!-- 飘落叶子（复用博客动画） -->
    <div class="leaves" id="leaves"></div>

    <!-- 头部 -->
    <header class="header">
        <div class="logo-container">
            <h1 class="logo-text">🌱 小绿吃豆人 🌱</h1>
            <p class="logo-sub">～ 吃豆子大赛 · 躲避幽灵 ～</p>
        </div>
    </header>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <ul>
                <li><a href="index.html">🏠 返回博客首页</a></li>
                <li><a href="#" class="active">🎮 小游戏</a></li>
            </ul>
        </div>
    </nav>

    <!-- 游戏区域 -->
    <main class="game-container">
        <div class="score-board">
            <div>得分: <span id="score">0</span></div>
            <div>剩余豆子: <span id="pellets">0</span></div>
            <div>生命: <span id="lives">3</span></div>
        </div>

        <canvas id="gameCanvas" width="560" height="600"></canvas>

        <!-- 移动端虚拟方向键 -->
        <div class="mobile-controls">
            <button class="mobile-btn" id="btnUp">↑</button><br>
            <button class="mobile-btn" id="btnLeft">←</button>
            <button class="mobile-btn" id="btnDown">↓</button>
            <button class="mobile-btn" id="btnRight">→</button>
        </div>

        <div class="game-controls">
            <h3>🎯 操作说明</h3>
            <div class="control-hint">
                <div><span class="key">↑ ↓ ← →</span> 方向键控制移动</div>
                <div>🟢 吃掉所有豆子获胜</div>
                <div>👻 躲避粉色幽灵</div>
                <div>💚 共3条生命</div>
            </div>
            <div>
                <button id="startBtn" class="game-btn">▶ 开始游戏</button>
                <button id="restartBtn" class="game-btn" style="display: none;">🔄 重新开始</button>
            </div>
        </div>
    </main>

    <!-- 游戏结束弹窗 -->
    <div class="game-message" id="gameMessage">
        <h2 id="messageTitle"></h2>
        <p id="messageText"></p>
        <button id="playAgainBtn" class="game-btn">🔄 再玩一次</button>
        <a href="index.html" class="game-btn back-btn">🏠 返回博客</a>
    </div>

    <script src="js/script.js"></script> <!-- 复用叶子飘落动画 -->
    <script src="js/pacman.js"></script>
</body>
</html>
